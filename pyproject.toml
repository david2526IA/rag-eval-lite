[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-lite"
version = "0.1.0"
description = "Small, reproducible retrieval metrics for local RAG evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "David"}]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rag-eval = "rag_eval_lite.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
